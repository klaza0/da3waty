<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>أكد بريدك في دعوتي</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f1e8;font-family:Tahoma,Arial,sans-serif;color:#2c2416;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f1e8;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;">
            <tr>
              <td style="padding:0 8px 20px;text-align:center;">
                <div style="font-size:28px;line-height:1.4;">دعوتي</div>
                <div style="margin-top:4px;font-size:13px;letter-spacing:0.18em;color:#b08d55;">DA3WATY</div>
              </td>
            </tr>
            <tr>
              <td style="background:#fffdf8;border:1px solid #e6dccf;border-radius:28px;padding:36px 28px;">
                <p style="margin:0;font-size:12px;letter-spacing:0.22em;color:#b08d55;">تأكيد الحساب</p>
                <h1 style="margin:14px 0 0;font-size:28px;line-height:1.45;font-weight:normal;">أهلاً بك في دعوتي</h1>
                <p style="margin:16px 0 0;font-size:16px;line-height:1.9;color:#7a6f62;">
                  خطوة واحدة وتقدر تبدأ تصنع دعواتك الإلكترونية. اضغط الزر لتأكيد بريدك.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin:28px auto 0;">
                  <tr>
                    <td style="border-radius:999px;background:#9c4b5c;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;color:#ffffff;text-decoration:none;font-size:15px;">تأكيد البريد الإلكتروني</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.8;color:#7a6f62;text-align:center;">
                  أو استخدم رمز التحقق
                  <br />
                  <span style="display:inline-block;margin-top:8px;padding:10px 16px;border-radius:16px;background:#f7f1e8;letter-spacing:0.28em;font-size:22px;color:#2c2416;">{{ .Token }}</span>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 12px 0;text-align:center;font-size:12px;line-height:1.8;color:#7a6f62;">
                إذا لم تنشئ حسابًا، تجاهل هذه الرسالة.
                <br />
                دعوتك... تبدأ من هنا
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
